; Personal EOTech example: six switch positions share five SVG patterns.
; Positions 1 and 2 share the ring geometry and use red and green light.

[reticle]
texture = wpn\wpn_addon_scope_eotech_crosshair_dot
units = moa
focal_plane = ffp
quality = high
; BC5 where the corners check allows (see the report)
compression = auto
holo = yes
; quality-check bound only; the actual magnification follows the installed 3DSS mapping
max_zoom = 3
scale = 1
center = 0, 0
; drawn at the size the 3DSS bitmap shows: its ring centre line is 82 px from the centre of a 1024 px Mark
; Switch cell, 34 MOA here
scale_mode = 3dss
legacy_span = 424.6

[illumination]
preview = 1, 0.05, 0.03
; Light colours come from the illum fill or the selected position override.
mark_colours = 
; leave headroom for bright laser grains instead of washing the whole ring white
illumination_luminance = 0.75
glow_strength = 0.45
glow_size = 0.55

colour_mode = authored
switch_states = [{"pattern": 1, "colour": null, "brightness": 1.0}, {"pattern": 1, "colour": [0.2, 1, 0.15], "brightness": 1.0}, {"pattern": 2, "colour": null, "brightness": 1.0}, {"pattern": 3, "colour": null, "brightness": 1.0}, {"pattern": 4, "colour": null, "brightness": 1.0}, {"pattern": 5, "colour": null, "brightness": 1.0}]
[holo]
; pronounced eye-driven laser grain; slow shimmer stays subordinate to the spatial speckle
speckle = 0.95
speckle_size = 1.8
speckle_eye_shift = 0.23
noise_animated = 0.02
noise_speed = 0.8
noise_size = 1.5
softness = 1.25
level = 0.75

[checks]
dot = 3.0
