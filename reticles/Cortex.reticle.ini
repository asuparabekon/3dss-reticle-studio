; Personal Cortex example: etched black surface; off, red and green positions.
; Razor HD Gen III 1-10x24 FFP, EBR-9 MOA (drawn by the owner). Subtensions from the Vortex sheet
; VTX_RZR-11001_EBR-9-BDC_MOA_I_RI_ST: centre dot 1, broken ring 4 / 5.5, scale end 20, bars from 24,
; post from 36, last drop 17.25 (all MOA).

[reticle]
; the 3DSS profile cortex_ebr9 of the Cortex Razor HD Gen III shows this texture
texture = wpn\scope_reticles\cortex\ebr9\cortex
units = moa
focal_plane = ffp
calibrated_magnification = 1
quality = normal
; BC5 where the corners check allows (see the report)
compression = auto
holo = no
max_zoom =
scale = 0.3369
center =
; drawn at the size the 3DSS bitmap shows (its solid bars and post start 321-324 px from the centre of the
; 4096 px texture, 70.1 MOA here: 4.62 px per MOA)
scale_mode = 3dss
legacy_span = 885

[illumination]
preview = scope_red2
paint_glows =
; an LPVO dot: hot with a tight red fringe by day, a large bloom at night
illumination_luminance = 8
glow_strength = 1

colour_mode = authored
mark_colours = 
switch_states = [{"pattern": 1, "colour": null, "brightness": 0}, {"pattern": 1, "colour": null, "brightness": 1}, {"pattern": 1, "colour": [0.1, 1, 0.05], "brightness": 1}]
[checks]
dot = 1.0
ring = 4.0, 5.5
scale_end_right = path16, centre_x, 20
scale_end_left = path34, centre_x, -20
bar_right = path69, left, 24
bar_left = path70, right, -24
post = path71, top, 36
last_drop = path36, bottom, 17.375
